<header class="app-header">
  <div class="header-left">
    <h1>Ascensores Iruña</h1>
    <p>Estado en tiempo real de los ascensores públicos de Pamplona</p>
    <span class="suggestion-text">Sugerencias: odeimardemor@gmail.com</span>
  </div>
  <div class="search-bar">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input
      type="text"
      placeholder="Buscar ascensor..."
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />
    @if (searchTerm()) {
      <button class="search-clear" (click)="clearSearch()" aria-label="Limpiar búsqueda">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    }
  </div>
</header>

<main class="app-main">
  <div class="map-panel">
    <app-elevator-map (reportClicked)="openReportDialog($event)" />
  </div>
  <div class="list-panel">
    <app-elevator-list (reportClicked)="openReportDialog($event)" (editClicked)="openEditDialog($event)" />
  </div>
</main>

@if (showDialog()) {
  <app-report-dialog
    [elevatorId]="selectedElevatorId()"
    [elevatorName]="selectedElevatorName()"
    [isEditing]="isEditing()"
    [errorMessage]="errorMessage()"
    (reportSubmitted)="onReportSubmitted($event)"
    (closed)="onDialogClosed()"
  />
}
