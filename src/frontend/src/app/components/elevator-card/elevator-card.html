<div class="elevator-card" [class]="statusClass()">
  <div class="card-header">
    <span class="status-icon" [innerHTML]="statusIcon()"></span>
    <div class="card-info">
      <h3 class="elevator-name">{{ elevator().name }}</h3>
      <p class="elevator-location">{{ elevator().location }}</p>
    </div>
  </div>
  <div class="card-details">
    <span class="status-label">{{ statusLabel() }}</span>
    @if (timeAgo()) {
      <span class="time-ago">Reportado {{ timeAgo() }}</span>
    }
    <span class="report-count">{{ elevator().totalReports }} reportes</span>
  </div>
  @if (elevator().canReport) {
    <button class="report-btn" (click)="reportClicked.emit(elevator().id)">
      Reportar estado
    </button>
  } @else {
    <button class="edit-btn" (click)="editClicked.emit(elevator().id)">
      Modificar reporte
    </button>
  }
</div>
